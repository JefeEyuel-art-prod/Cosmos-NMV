name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'cosmos-app/**'
      - 'backend/**'
      - '.github/workflows/build.yml'

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cosmos-api:latest
            ${{ secrets.DOCKER_USERNAME }}/cosmos-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./cosmos-app
          file: ./cosmos-app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cosmos-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/cosmos-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-k8s:
    needs: [build-api, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update K8s deployments
        run: |
          kubectl set image deployment/cosmos-api cosmos-api=${{ secrets.DOCKER_USERNAME }}/cosmos-api:${{ github.sha }} -n default
          kubectl set image deployment/cosmos-frontend cosmos-frontend=${{ secrets.DOCKER_USERNAME }}/cosmos-frontend:${{ github.sha }} -n default
          kubectl rollout status deployment/cosmos-api -n default --timeout=5m
          kubectl rollout status deployment/cosmos-frontend -n default --timeout=5m
