---
# Transits Microservice
apiVersion: v1
kind: ConfigMap
metadata:
  name: transits-config
  namespace: default
data:
  PORT: "8001"
  SERVICE_NAME: "transits"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transits-service
  namespace: default
  labels:
    app: transits
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transits
  template:
    metadata:
      labels:
        app: transits
        version: v1
    spec:
      containers:
      - name: transits
        image: eyuel21/cosmos-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
          name: http
        env:
        - name: PORT
          value: "8001"
        - name: NODE_ENV
          value: "production"
        envFrom:
        - configMapRef:
            name: transits-config
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: transits
  namespace: default
  labels:
    app: transits
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: transits

